name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy mutmut_ratchet/
      - name: Test
        run: uv run pytest -n auto --cov=mutmut_ratchet --cov-report=term-missing --tb=short --cov-fail-under=95
      # This project deliberately does not mutation-test itself in CI: the scope
      # is kept small, and the suite already covers 100% of the package. Run
      # `uv run mutmut run` locally if you want the deeper signal.
