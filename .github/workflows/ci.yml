name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint-and-test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy mutmut_ratchet/
      - name: Test
        run: uv run pytest -n auto --cov=mutmut_ratchet --cov-report=term-missing --tb=short --cov-fail-under=95
      # This project deliberately does not mutation-test itself in CI: the scope
      # is kept small, and the suite already covers 100% of the package. Run
      # `uv run mutmut run` locally if you want the deeper signal.
